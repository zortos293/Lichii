[Theme]
name=Art Dark
; The built-in theme that provides the icons and the palette:
; default, colorful, qdarkstyle, colorful_dark, qdarkstyle_midnight_blue,
; colorful_midnight_blue or lichii
base=lichii
dark=true
; The colour of selected icons, of the selection and of links
accent=#82a88b
; true applies the base theme's stylesheet before style.qss
inherit=false
